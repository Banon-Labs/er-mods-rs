name: release

# Every main commit gets an immutable prerelease containing every ME3-loadable
# DLL. Release Please separately creates draft versioned releases from
# conventional commits; those receive the exact same staged, attested files
# before this workflow publishes them.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs on main so two merges cannot race release bookkeeping or create
# conflicting release assets concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in lockstep with .github/workflows/check.yml, which carries the reasoning:
  # this pin decides which game builds the DLLs survive, because every upstream
  # singleton (`T::instance_ptr()`) resolves through upstream's own version-keyed
  # RVA bundle and PANICS on a build that bundle does not list. `1027d24` is the
  # first revision that knows 2.7.0.0 (patch 1.17) while keeping 2.6.2.0.
  FROMSOFTWARE_RS_REV: 16d266146bcc7e896ac0d9a2c020e0d4c07baf52
  # WHICH REMOTE THE PIN ABOVE ACTUALLY EXISTS ON -- and the half of "lockstep with
  # check.yml" that this file was missing until 2026-09-01. `1027d24` and its parent
  # `4284a05` (the 2.7.0.0 / patch 1.17 RVA bundle) exist ONLY on the fork; upstream
  # advertises 325 refs and neither sha is reachable from any of them. Cloning
  # vswarte/ and then checking out this pin dies with `fatal: unable to read tree`
  # at step 2, before a single Rust check runs -- which is what it did on main at
  # b9109a30. Copying the REV without the REMOTE is what made that possible.
  #
  # Point this back at https://github.com/vswarte/fromsoftware-rs.git the moment
  # FROMSOFTWARE_RS_REV names a commit that is merged upstream. It is a clone URL
  # for a read-only checkout and nothing else; the rev pin above still decides
  # which game builds the DLLs survive, and it is unchanged.
  FROMSOFTWARE_RS_REMOTE: https://github.com/chozandrias76/fromsoftware-rs.git
  CARGO_XWIN_VERSION: 0.23.0

jobs:
  release-please:
    # A manually dispatched workflow from another branch must never open a
    # release PR or alter a release sourced from that branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release branch, create tags/releases
      pull-requests: write # open/update the release PR
      issues: write # apply autorelease labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Draft first: immutable releases allow asset changes only before
          # publication. upload-versioned-release publishes after attaching the
          # staged, attested DLLs.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build once per main commit, then publish the staged files to its immutable
  # user prerelease and, when Release Please creates a draft, to that release.
  # amd_ags_x64.dll is deliberately excluded: er-ags-stub impersonates AMD's
  # vendor DLL filename and is only a local RenderDoc-capture swap-in.
  build-attest-publish-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/edit rolling release and upload its assets
      id-token: write # sign attestations (Sigstore OIDC)
      attestations: write # persist attestations
    steps:
      - uses: actions/checkout@v4

      - name: Check out fromsoftware-rs as sibling
        run: |
          git clone "$FROMSOFTWARE_RS_REMOTE" "$GITHUB_WORKSPACE/../fromsoftware-rs"
          git -C "$GITHUB_WORKSPACE/../fromsoftware-rs" checkout "$FROMSOFTWARE_RS_REV"

      - name: Check out MinHook vendor source
        run: git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git vendor/minhook

      - name: Install Rust (stable + windows target)
        run: |
          sudo apt-get install -y --no-install-recommends clang lld llvm \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm; }
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}

      # Same cache key as check.yml so this job rides the already-warmed
      # main-scoped CRT/SDK cache instead of re-downloading ~1 GB.
      - name: Cache xwin Windows CRT/SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}-cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      - uses: Swatinem/rust-cache@v2

      # scripts/me3-dll-list.py is the single source of truth for every
      # shippable ME3 native. er-build-dlls also records source/artifact
      # provenance beside each DLL while the source tree is still available.
      - name: Build every distributable DLL
        run: bash scripts/er-build-dlls.sh --all

      # The installer carries the DLLs inside itself, so it must be built AFTER them and
      # pointed at where they landed. Most people download the installer and nothing else --
      # no repo, no folder beside it -- so a build without ER_INSTALLER_EMBED_DIR produces a
      # perfectly good 440 KB binary that can install nothing, and nothing about it looks
      # wrong. The next step is what refuses to ship that.
      #
      # Two hosts, because me3 runs natively on Linux, where the game is a Proton process:
      # the mods stay PE for everyone and only the installer differs.
      - name: Build the self-contained installer for both hosts
        env:
          ER_INSTALLER_EMBED_DIR: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release
        run: |
          cargo xwin build --release --target x86_64-pc-windows-msvc -p er-installer
          cargo build --release -p er-installer

      # Ask the binary, rather than trust that the step above had the right environment. This
      # exits non-zero unless the executable carries every mod its catalog offers.
      - name: Prove the installer carries every mod it offers
        run: ./target/release/er-installer --selfcheck

      - name: Stage release assets
        run: |
          mkdir dist
          while IFS=: read -r _ artifact; do
            cp "target/x86_64-pc-windows-msvc/release/${artifact}.dll" dist/
            cp "target/x86_64-pc-windows-msvc/release/${artifact}.dll.provenance.json" dist/
          done < <(python3 scripts/me3-dll-list.py --pairs)
          # Both installers are attached as plain files rather than inside an archive: the
          # whole point is that one download is the whole thing, and a user who has to unpack
          # a zip to find it has already been asked to do more than run it.
          cp target/x86_64-pc-windows-msvc/release/er-installer.exe dist/
          cp target/release/er-installer dist/er-installer
          chmod +x dist/er-installer
          (cd dist && sha256sum -- *.dll er-installer.exe er-installer > SHA256SUMS)

      # Attest every distributable DLL, not merely the archive/container that
      # carries it, so `gh attestation verify <downloaded-dll>` remains useful.
      # The installers are attested for the same reason and it matters more for
      # them: they are the files an ordinary player downloads and runs, and a
      # 34 MB unsigned executable from the internet is exactly the thing worth
      # being able to check the provenance of.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.dll
            dist/er-installer.exe
            dist/er-installer
            dist/SHA256SUMS

      # Transfer the exact staged files to the conditional versioned-release
      # job. Users download from Releases; this one-day Actions artifact exists
      # only to avoid a second build when a main commit creates a version tag.
      - name: Preserve staged files for versioned release
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

      # Immutable Releases are enabled for this repository, so published
      # releases and their tags cannot be changed. Each main commit therefore
      # receives its own immutable prerelease rather than a mutable latest tag.
      - name: Publish immutable main prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rolling_tag="main-${GITHUB_SHA}"
          # The asset list is 60-odd files and only two of them are for a player. Say which,
          # and say that they are complete on their own -- someone who downloads a single
          # 34 MB executable has a fair reason to wonder where the mods are.
          # The prose lives in .github/release-notes-header.md rather than inline here. A
          # heredoc cannot carry it: YAML forbids tab indentation outright, and a body
          # indented with spaces to stay inside this block scalar arrives with that
          # indentation intact, which renders the whole release page as a code block. A file
          # is also the half of this that someone might want to edit without reading YAML.
          notes_file="$(mktemp)"
          cat .github/release-notes-header.md > "$notes_file"
          printf '\nDevelopment build from commit %s. Every main build has its own immutable prerelease; use a numbered release for an immutable stable version.\n' \
            "$GITHUB_SHA" >> "$notes_file"
          gh release create "$rolling_tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Main build ${GITHUB_SHA::12}" \
            --notes-file "$notes_file" \
            --prerelease

  # Release Please creates the versioned release as a draft. Attach the files
  # built from that same main commit, then publish the immutable release.
  upload-versioned-release:
    needs: [release-please, build-attest-publish-main]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - name: Retrieve staged release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Populate and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$tag_name" dist/*
          gh release edit "$tag_name" --draft=false
