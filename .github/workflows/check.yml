name: check

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger to re-warm the main-scoped tool caches (cupcake, xwin
  # CRT/SDK, rust-cache) if GitHub evicts them after an idle week, without
  # having to push a commit.
  workflow_dispatch:

# One live run per ref: superseded runs on the same PR/branch are cancelled
# instead of running to completion. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Commit of vswarte/fromsoftware-rs the workspace is developed against.
  # The root crate uses `../fromsoftware-rs` path dependencies, so the
  # workspace cannot even be loaded by cargo without this sibling checkout.
  #
  # THIS PIN DECIDES WHICH GAME BUILDS THE DLLs SURVIVE, and it is not a
  # taste question. Every `T::instance_ptr()` in this workspace -- 63 sites
  # across 17 crates, and the ONLY way `er-death-persist` and
  # `mushroom-man-runtime` reach the game at all -- resolves through
  # upstream's own `crates/eldenring/src/rva/` bundle, selected by the
  # running image's PE version. `er-game-base`'s 1.17 gate is not on that
  # path and cannot cover it. Upstream's `rva::get()` ends in
  # `unwrap_or_else(|e| panic!("{e}"))`, so an unrecognised build is a PANIC
  # inside a game-loaded cdylib on the first singleton access, not a refusal.
  #
  # The previous pin, `9028518` ("Bump to 0.14.0"), predates the 1.17
  # bundle by two commits: at that revision `ERGameVersion::from_lang_version`
  # knows only `2.6.2.0` and `2.6.2.1`, and the installed game has been
  # `2.7.0.0` since 2026-08-27. The local sibling checkouts were already
  # past it, so local builds worked and only a CI-built artifact carried the
  # panic -- the split where the released DLL differs from the tested one.
  #
  # `1027d24` is the local sibling checkout's own revision. It adds
  # `rva/rva_ww_270.rs` (`4284a05`) and fixes an ambiguous `cs_system_step`
  # pattern that picked a different global on 2.7.0.0 (`1027d24`), while
  # KEEPING `2.6.2.0`/`2.6.2.1`. Do not advance this to upstream `main`
  # without re-verifying: `acb2a19` DELETES `rva_ww_270.rs` and rewrites
  # `rva_ww.rs`/`rva_jp.rs` as 1.17-only, dropping 1.16.2 support entirely.
  FROMSOFTWARE_RS_REV: 1027d24920c0d71fcc17666194d331af0666fc3a
  # WHICH REMOTE THE PIN ABOVE ACTUALLY EXISTS ON. This step used to clone
  # vswarte/fromsoftware-rs unconditionally, and from 2026-08-30 18:31 that made
  # this whole workflow dead: `1027d24` and its parent `4284a05` (the ones that
  # add the Elden Ring 2.7.0.0 / patch 1.17 RVA bundle) exist ONLY on the fork.
  # Verified against both remotes -- upstream advertises 325 refs and neither sha
  # is reachable from any of them. So `git checkout` died with `fatal: unable to
  # read tree`, at step 2 of ~15, and every Rust check below it reported NOTHING:
  # not pass, not fail. That blind window is exactly when two commits reached
  # origin that do not compile (15b32ab0, 11af0c60).
  #
  # Point this back at https://github.com/vswarte/fromsoftware-rs.git the moment
  # FROMSOFTWARE_RS_REV names a commit that is merged upstream. It is a clone URL
  # for a read-only checkout and nothing else; the rev pin above still decides
  # which game builds the DLLs survive, and it is unchanged.
  FROMSOFTWARE_RS_REMOTE: https://github.com/chozandrias76/fromsoftware-rs.git
  # Commit of eqtylab/cupcake the policy checker is built from. Also keys the
  # cache of the built binary -- bumping the rev invalidates the cache.
  CUPCAKE_REV: 27b94b8
  # cargo-xwin release to install. Pinned because it also keys the cache of the
  # Windows CRT/SDK that cargo-xwin downloads (defaults such as the bundled
  # xwin manifest version only move when this version moves).
  CARGO_XWIN_VERSION: 0.23.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out fromsoftware-rs as sibling
        run: |
          git clone "$FROMSOFTWARE_RS_REMOTE" "$GITHUB_WORKSPACE/../fromsoftware-rs"
          git -C "$GITHUB_WORKSPACE/../fromsoftware-rs" checkout "$FROMSOFTWARE_RS_REV"

      - name: Check out MinHook vendor source
        run: git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git vendor/minhook

      - name: Install Rust (stable + windows target + wine)
        run: |
          # Runner apt lists are usually fresh enough to install without an
          # `apt-get update` (~20-60 s); fall back to updating only on a miss.
          sudo apt-get install -y --no-install-recommends clang lld llvm wine \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm wine; }
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add x86_64-pc-windows-msvc

      # Prebuilt release binary; replaces a ~1 min `cargo install cargo-xwin`.
      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}

      # On first use cargo-xwin downloads + unpacks the MSVC CRT and Windows
      # SDK into ~/.cache/cargo-xwin. That download comes from Microsoft's CDN
      # and its duration is wildly variable -- observed 40 s on a good run and
      # 12 m 44 s on a throttled one (run 28757404582) -- so restore it from
      # the Actions cache instead of re-downloading every run. The content is
      # fully determined by the pinned cargo-xwin version, so an exact-key hit
      # is expected every run and the ~1 GB dir is only uploaded once per bump.
      - name: Cache xwin Windows CRT/SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}-cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      - name: Install OPA policy engine
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      # Cupcake has no prebuilt releases at our pinned rev, so cache the binary
      # we build; the ~4.5 min source build then only runs when CUPCAKE_REV moves.
      - name: Cache Cupcake binary
        id: cache-cupcake
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cupcake
          key: cupcake-${{ runner.os }}-${{ env.CUPCAKE_REV }}

      - name: Install Cupcake policy checker
        if: steps.cache-cupcake.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/eqtylab/cupcake.git --rev "$CUPCAKE_REV" cupcake-cli --locked

      - uses: Swatinem/rust-cache@v2

      # DOES THE COMMITTED STATE COMPILE? Deliberately the FIRST Rust step: it is the most basic
      # claim any gate below makes, and on 2026-08-31 it was false on the shared branch for hours
      # while a dozen agents built on top of it.
      #
      # --workspace IS THE LOAD-BEARING FLAG. The workspace sets
      # `default-members = ["crates/er-quickload"]`, so a bare `cargo xwin check`/`build` -- the
      # form scripts/ci-local-check.sh ends with -- selects that one package and exits 0 in a
      # fraction of a second having compiled nothing else, which reads exactly like a successful
      # incremental build. Both commits that broke the branch landed a CONSUMER without its
      # PRODUCER in crates outside er-quickload's dependency closure at that commit
      # (er-save-suppress; er-quickload's own reference to two crates not yet in the tree), so the
      # bare form had nothing to say about either.
      #
      # --all-targets so `#[cfg(test)]` modules, benches and examples compile too -- a lib-only
      # check reports OK over a test module naming a helper the commit does not carry. Measured on
      # a cold cache the same day: 100 s with it, 105 s without, so it costs nothing.
      #
      # --keep-going so one broken crate does not hide the state of the rest: without it the run
      # stops at the first failure and the report understates the damage.
      #
      # NO WORKTREE HERE, unlike scripts/check-committed-compiles.sh, which does the same job
      # locally. That script exists because a developer's working tree still holds the uncommitted
      # producer and therefore disagrees with the commit; actions/checkout has put the pushed
      # commit's tree on this runner and nothing else, so the distinction cannot arise.
      - name: Does the committed state compile (whole workspace, windows target)
        run: cargo xwin check --workspace --all-targets --keep-going --target x86_64-pc-windows-msvc

      - name: Lint - no lossy UTF-8
        run: python3 scripts/check-no-lossy-utf8.py

      - name: Lint - no timeout/sleep control flow
        run: |
          python3 scripts/check-no-timeouts.py
          python3 scripts/test-no-timeouts.py
          cupcake validate --log-level error
          python3 scripts/test-cupcake-policies.py
          # The delivered-shape gate, which test-cupcake-policies.py used to shell out to and no
          # longer does (see the comment at the top of that file). This job does not run
          # scripts/check.sh, so without these two lines CI would have no delivered-shape coverage
          # at all. --selftest and the live run are different runs: the first proves the gate
          # rejects a fictional fixture, the second checks the real contract.
          python3 scripts/test-cupcake-delivered-shape.py --selftest
          python3 scripts/test-cupcake-delivered-shape.py

      # Both halves of the refactor/move DLL byte-identity gate
      # (.github/workflows/refactor-byte-identical.yml): the trigger that decides
      # which PRs it applies to, and the comparator that decides what counts as a
      # difference. Neither is exercised by that workflow's own runs on ordinary
      # PRs, so they are tested here instead of rotting until the day one fires.
      - name: Test the DLL byte-identity gate
        run: |
          bash scripts/test-pr-refactor-scope.sh
          python3 scripts/test-dll-byte-identical.py

      - name: Test public DLL-release workflow
        run: python3 scripts/test-release-workflow.py

      - name: rustfmt
        run: cargo fmt --all -- --check

      # Parity with the parent project's lint strictness. Asserts the CONFIGURATION here;
      # the code itself is linted by scripts/check-rust-build.sh below. This step reads the
      # ../fromsoftware-rs checkout made above, so it also fails when upstream adds a lint
      # knob we have not adopted.
      - name: Lint parity with fromsoftware-rs
        run: |
          python3 scripts/check-lint-parity.py --selftest
          python3 scripts/check-lint-parity.py

      - name: Test host-buildable crates
        run: cargo test -p er-soulsformats -p er-param-inspect

      # Full link of the DLL needs the MSVC linker; cargo-xwin provides the
      # Windows SDK import libraries needed for Linux-hosted type-checks. Use
      # the same script as scripts/check.sh so CI also compiles cfg(test) code
      # and runs the Windows-target lib tests through Wine.
      - name: Check DLL crate (windows target)
        run: bash scripts/check-rust-build.sh
