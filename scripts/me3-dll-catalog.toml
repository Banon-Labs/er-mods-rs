# What each ME3-loadable DLL is CALLED, and what it does, in words a player can read.
#
# WHY THIS FILE IS SEPARATE FROM `me3-dll-conflicts.toml`
# ------------------------------------------------------
# The conflict table answers "can these two share a process", and every word in it is
# reverse-engineering evidence: prologue addresses, handler symbols, the run that measured
# the collision. This file answers "what should the row in the picker say", which is product
# copy. Mixing them would put a label edit in the same diff as a hook-collision finding, and
# the reviewer of one is not the reviewer of the other.
#
# CONSUMED BY  scripts/gen-installer-catalog.py  (emits tools/er-installer/src/catalog.rs)
# GATED BY     scripts/check-me3-dll-catalog.py  (coverage both ways + the rules below)
#
# THE RULES THE GATE ENFORCES, and why each one exists
# ----------------------------------------------------
#  * Every shipped shell has exactly one entry, and every entry is a shipped shell. A new
#    cdylib with no entry would be invisible in the installer -- shipped, and unreachable.
#  * `audience = "diagnostic"` implies `default = false`. These drive input, install trace
#    detours, or write telemetry nobody reads back; a player who ticks one has decided to.
#  * A package listed in `[opt_in_only]` in the conflict table implies `default = false`.
#    That table is where a mod that changes params or drives input records that it must be
#    asked for. Two tables disagreeing about consent is the bug, so the gate refuses it.
#  * THE DEFAULT SET MUST BE CONFLICT-FREE. This is the rule worth having: the gate builds
#    the set of `default = true` packages and runs it through the same conflict check the
#    installer uses. A first-run profile that cannot load is the one failure a picker has no
#    excuse for, and it is now impossible to commit.
#
# FIELDS
#   label           short name for the picker row
#   blurb           one sentence, <= 200 chars, present tense, no addresses or crate names
#   category        menus-and-saves | quality-of-life | multiplayer | cosmetic | diagnostics
#   audience        player | diagnostic
#   default         ticked on a first run
#   needs_seamless  true when the DLL is inert or refuses without Seamless Co-op loaded
#   config          the DLL's own file in the game directory, when it has one worth naming
#   caution         why this one is never ticked for you, in a few words that fit on a picker
#                   row. Required for a package in `[opt_in_only]` and refused for any other:
#                   that table is the record that a mod has to be asked for by name, and the
#                   row must say which consequence it is asking about. The picker printed a
#                   generic "(changes things)" for all of them until 2026-09-19, which told a
#                   reader nothing they could act on -- a costume change and a Seamless
#                   matchmaking lockout are not the same warning.

[er-quickload]
label = "Quickload: boot straight to your character"
blurb = "Boots past the logo and title into your character. System > Quit adds rows to switch character or save file and to import or share a build link. Vanilla online play is off."
category = "menus-and-saves"
audience = "player"
default = true
config = "er-quickload.toml"

[er-quit-menu]
label = "Quit-menu build links"
blurb = "Adds Quit-menu rows that apply an er-build-planner build link to your character and turn your current build into a link. The Load Character rows browse but don't load."
category = "menus-and-saves"
audience = "player"
default = false
config = "er-quit-menu.toml"

[er-save-picker]
label = "Boot save picker (part of Quickload)"
blurb = "Does nothing visible on its own. The boot save picker works only inside Quickload, which already includes it."
category = "menus-and-saves"
audience = "player"
default = false
# `er-quickload` carries this: its defaults include `autoload`, and `arm_boot_picker` is
# reached whenever that is on.
#
# The rule that decides this row is `autoload`, not "links the picker crate", and it was worth
# writing down: the retired `er-quit-rows` fork linked the same crate and was listed here for an
# hour on 2026-09-19 before the reading corrected it. Its `boot_arm_missing_save_picker_in_game`
# opened with `if !cfg!(feature = "autoload") { return false; }` and `autoload` was not in its
# default set, so the shipped build never armed the boot picker. `er-quit-menu` is in the same
# position and is likewise not listed: it is a shell over `er-quit-menu-core` with no boot-view
# module of its own, so there is nothing there to arm.
#
# The picker does try to stand down against the product -- `GetModuleHandleA("er_quickload.dll")`
# -- but that runs inside `DllMain`, so it only sees a module that has already attached, and
# ME3 attaches in profile order. Not a crash, which is why this is `included_in` rather than a
# `[[conflict]]` row; still refused, because nobody wants one feature installed twice and
# which copy wins is decided by a list order the player never sees.
included_in = ["er-quickload"]

[er-build-import]
label = "Build planner import"
blurb = "Once per launch, makes the first existing character you load the ?b= planner build in er-quickload.toml's build_url: gear, items, stats, spells, class, name, looks. Other gear is stored or dropped."
category = "menus-and-saves"
audience = "player"
default = false
config = "er-quickload.toml"

[er-save-disable]
label = "Disable saving"
blurb = "Nothing you do while this is loaded is written to your save file. Quit and load again to go back to your last save from before it was loaded."
category = "menus-and-saves"
audience = "player"
default = false

[er-better-refills]
label = "Instant storage refills and deposits"
blurb = "Flagging an item for autorefill restocks all flagged items from storage at once and after every loading screen. Unflagging returns carried copies to the box."
category = "quality-of-life"
audience = "player"
default = true

[er-refill-all]
label = "Refill all / refill none"
blurb = "In the storage box, Select+Start marks every refillable item to auto-refill and restocks you from storage at once; press again to unmark them all."
category = "quality-of-life"
audience = "player"
default = true
config = "er-refill-all.toml"

[er-inventory-sort]
label = "Equipment sort order"
blurb = "Sorts the Armaments, Armor and Talismans lists by Order of Acquisition every time the game starts. Each list can be set to Item Type or left as the game has it."
category = "quality-of-life"
audience = "player"
default = true
config = "er-inventory-sort.toml"

[er-convenient-deaths]
label = "Convenient deaths"
blurb = "Keep your runes on death with no bloodstain, keep an active Rune Arc, and shorten the YOU DIED screen in solo play. All off until enabled in er-convenient-deaths.toml."
category = "quality-of-life"
audience = "player"
default = true

[er-death-persist]
label = "Keep transformations through death"
blurb = "Rock Heart, Priestess Heart and Lamenter's Mask transformations come back when you respawn."
category = "quality-of-life"
audience = "player"
default = false

[er-focus-input]
label = "Input while unfocused"
blurb = "The game keeps responding to your controller while another window has focus, so buttons you press for that window also reach your character."
category = "quality-of-life"
audience = "player"
default = false

[er-enemynpc-effects]
label = "Charm all NPCs"
blurb = "Ctrl+Alt+C charms every loaded NPC, bosses included, to fight for you, and charms new ones as they load. Press again to undo."
category = "quality-of-life"
audience = "player"
default = false
config = "er-enemynpc-effects.toml"

[er-npc-possess]
label = "Possess enemies"
blurb = "Lock on to an enemy and press F9 or L3+R3 to take control of it and fight with its moveset. Press again to let go. Its attacks don't damage other players."
category = "quality-of-life"
audience = "player"
default = false
config = "er-npc-possess.toml"

[er-allow-hostile-actions]
label = "Fight in no-combat zones"
blurb = "Lets you attack, use skills, cast spells and guard in Roundtable Hold and in rooms that become no-combat during invasions."
category = "quality-of-life"
audience = "player"
default = false

[er-seamless-bugfixes]
label = "Co-op and quit-to-desktop crash fixes"
blurb = "Fixes three crashes: one on quit to desktop, one when a spirit ash is summoned in co-op, and one when a co-op item pickup arrives during a load."
category = "multiplayer"
audience = "player"
default = true

[er-invasion-warp]
label = "Local invasions"
blurb = "Invasion fingers work in Seamless and search your area for hosts who also run this mod. The map's Multiplayer Status Display pins invader spawns to warp to while solo."
category = "multiplayer"
audience = "player"
default = false
needs_seamless = true
config = "er-invasion-warp.toml"

[er-invasion-path]
label = "Path to other players"
blurb = "Press ; to draw the walkable route to each player over 30 m away, visible through walls, or an arrow toward them when no route is found."
category = "multiplayer"
audience = "player"
default = false
config = "er-invasion-path.toml"

[er-player-name-filter]
label = "Mask other players' names"
blurb = "Replaces the names of players you list in its config file, by exact name or pattern, with a numbered label you choose on nameplates and multiplayer banners."
category = "multiplayer"
audience = "player"
default = false
config = "er-player-name-filter.toml"

[er-net-effects]
label = "Effect selector"
blurb = "Put effects on your character from an on-screen list (Alt+9) or hotkeys, and keep chosen ones always on. Other players see them, but only cosmetic effects work while they are present."
category = "multiplayer"
audience = "player"
default = false

[er-armament-icons]
label = "Ash of War icons on weapons"
blurb = "Armaments in the equipment, inventory and storage chest menus show their Ash of War's icon, as do the HUD's left and right weapon slots."
category = "cosmetic"
audience = "player"
default = true

[er-r3-view]
label = "Weapon board in the item list"
blurb = "A fourth R3 view in the equipment list shows a weapon board: how it stands out, top infusions, speed, parrying and synergy gear. Needs Build watermark or another overlay mod."
category = "cosmetic"
audience = "player"
default = false

[er-loading-portrait]
label = "Hide loading-screen tips"
blurb = "Hides the tips on every loading screen. Proton/Wine only: on native Windows it also covers the game with a black screen."
category = "cosmetic"
audience = "player"
default = false

[er-target-bars]
label = "Target stance and status bars"
blurb = "Color-coded bars under your locked-on target's HP bar: stance, stamina and FP where the target has them, and each status ailment as it builds up or procs."
category = "quality-of-life"
audience = "player"
default = false

[er-duel-rules]
label = "Duel rules referee"
blurb = "Names whoever breaks the duel ruleset and how: Rune Level not 125, banned gear, skills or spells, heals, Torrent, respecs, extra blue flasks. Logged to a text file. F2 edits the rules and adds bans."
category = "multiplayer"
audience = "player"
default = false
config = "er-duel-rules.toml"

[er-positional-voice]
label = "Positional voice chat"
blurb = "Every player's voice comes out of their character, fading with distance and echoing in caves, over Steam voice. Everyone in the session needs it."
category = "multiplayer"
audience = "player"
# On by default: Seamless's own voice chat cannot sound, because its Play_VoiceChat event is in
# no bank the game loads (bd er-play-voicechat-event-not-loaded-1171-2026-10-17), so with this
# off the in-game voice setting does nothing.
default = true
needs_seamless = true
config = "er-positional-voice.toml"

[er-npc-summons]
label = "NPC duels and Mimic Tear companions"
blurb = "The Duelist's Furled Finger summons an NPC you pick (Yura by default) to duel you. Mimic Tear Ashes can instead bring up to four companions in builds you link."
category = "multiplayer"
audience = "player"
default = false
caution = "changes two items"

[er-build-watermark]
label = "Outdated build warning"
blurb = "Names any of these mods' DLLs that is up to 11 releases behind the newest, in faint red in the top-right corner. Needs internet, and warns only if no other overlay mod loads first."
category = "cosmetic"
audience = "player"
default = false

[er-cel-shade]
label = "Cel shading"
blurb = "Cartoon shading: banded light, inked outlines, flattened surface color and stepped brightness. F6 opens presets and live sliders."
category = "cosmetic"
audience = "player"
default = false
caution = "changes how every scene looks"

[er-render-scale]
label = "Render scale"
blurb = "Draws the 3D scene at a lower resolution while the menus and HUD stay sharp. F5 in game opens a slider of the sizes that fit your screen exactly, saved to er-render-scale.toml."
category = "cosmetic"
audience = "player"
default = false
config = "er-render-scale.toml"
caution = "softens the picture once a scale is set"

[mushroom-man-runtime]
label = "Mushroom Child (Dark Souls)"
blurb = "Draws you and every other human on screen as Dark Souls' Mushroom Child, armour hidden but still worn. Build it once with mushroom-man-builder.exe from Dark Souls Remastered."
category = "cosmetic"
audience = "player"
default = false
caution = "changes how your character looks"

[er-crash-logging]
label = "Crash and freeze logging"
blurb = "Logs crashes, freezes and long frame drops to files beside eldenring.exe, plus a minidump when the game crashes or freezes. Also stops the game's own crash on every quit to desktop."
category = "diagnostics"
audience = "player"
default = true

[er-hotkey-conflicts]
label = "Hotkey conflict report"
blurb = "Logs keys that two or more mods use, and held keys the game never receives, to er-hotkey-conflicts.log in the Game folder. Mods that read the whole keyboard or a gamepad aren't checked."
category = "diagnostics"
audience = "player"
default = true

[er-telemetry]
label = "Performance telemetry"
blurb = "Logs frame time, CPU load and window/display-mode changes five times a second to er-telemetry-timeseries.jsonl beside eldenring.exe."
category = "diagnostics"
audience = "diagnostic"
default = false

[er-diag-harness]
label = "Map-load diagnostic log"
blurb = "Traces map loading and DLC map-path clears and refills to er-diag-harness.log beside eldenring.exe."
category = "diagnostics"
audience = "diagnostic"
default = false

[er-input-harness]
label = "Input test harness"
blurb = "Test tool. Keeps input live while the game is unfocused. With Quickload it presses 'press any button' after you quit to title. Alone it continues your last character, opens the System menu and stops."
category = "diagnostics"
audience = "diagnostic"
default = false
caution = "drives the controls itself"

[er-reload-trace]
label = "Reload trace"
blurb = "Logs the game's save, load and title-menu calls to er-reload-trace.log in the game folder, for debugging reloads. The log grows by hundreds of MB an hour."
category = "diagnostics"
audience = "diagnostic"
default = false
