[[conflict]]
a = "er-quickload"
b = "er-build-import"
kind = "duplicate-owner"
reason = """Both link `er-build-import-runtime`, and a statically linked crate's statics are \
PER DLL: two copies of the phase machine, two fetch workers, two CSTaskImp FrameBegin tasks, all \
mutating one character's inventory, equipment slots and PlayerGameData. The shell imports the \
configured `build_url` unprompted at character load while the product's System>Quit "Load Build \
from URL" row imports on demand, so the two interleave grants and stat writes with no shared \
lock -- and the shell's import can land on a character the player never asked to rebuild. \
Neither installs a detour, so this is not a hook collision: it is two owners of one mutation. \
The product DLL is the one to keep; the shell exists for profiles that do not load it."""
evidence = "crates/er-build-import/src/lib.rs:23; crates/er-quickload/src/experiments/startup_hooks/quit_menu/build_url_row.rs"

