`jmp` where the prologue should be. The Save Game row needs that observer to see the overwrite \
confirm's result: without it `emit_observer_installed=0`, the confirm is never built, and picking \
an existing destination dies on `overwrite-file-confirm BUILD TIMEOUT after 180 ticks` with \
nothing written (run br-20260913-002757-9317). Same mechanism as the er-quickload pair below.

Measured on `er-save-game-row`, which shipped that row alone until 2026-09-20 and has since \
merged into this shell: the flow, the observer and the box builder are all in \
`er-quit-menu-core`, which both linked. The row is one of the five `er-quit-menu.toml` can name, \
and the table has no way to say "conflicts only when that row is configured" (bd \
er-effects-rs-38gi), so the pair is declared for every configuration. Over-declaring costs a \
profile someone has to justify; under-declaring costs a save the player asked for and did not \
get."""
