compares the live window byte-for-byte against a constant `build.rs` generated from named \
`iced-x86` instructions before writing, and reads the byte back afterwards; a mod that got there \
first fails the first check and the patch DISARMS, and a mod that arrives later cannot corrupt \
anything of ours because there is no trampoline to overwrite -- the byte is simply theirs.

