catch can arise -- no second MinHook instance can overwrite a trampoline it never installed, and \
no D3D12 Present/compositor is touched.

WHICH BYTES, AND WHO ELSE COULD WANT THEM. The three sites are 1.16.2 `0x5fc0c0+0x0` (the \
bloodstain writer's entry), `0x25e1e0+0x9` (the rune-arc clear's 16-bit store) and \
