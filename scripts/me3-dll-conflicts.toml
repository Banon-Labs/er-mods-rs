elects one owner by arrival order and every later host registers through it, so the process no \
longer gets two row tables -- what it gets instead is whichever DLL won the race deciding what the \
rows do, silently, with the loser's flows refused.

Measured on run br-20260917-205031-edd3, which carried both. `er_quit_menu.dll` won the election \
(`quit-row-registry: module 0x6ffff8470000 already holds the process row table -- delegating`, \
from the product's log) and claimed the slot; the product's registration then came back \
`open_profile_load_dialog=offered-but-already-held`. The two openers are not interchangeable. The \
shell's opens the native `05_010_ProfileSelect` and a pick runs the game's own in-world load, so \
gear and level change on the character already standing there and the world is never torn down. \
The product's arms the save-safe switch and cancel-closes the picker, and the menu-pump \
return-title chain then tears the world down and deserialises the picked slot. The player pressed \
Load Character, picked another slot, and got the shell's behaviour with the product loaded -- the \
user's report, verbatim: "You're still loading a character in place instead of doing a real load \
when I load another slot in my save file".

The grid half of the old entry still stands alongside it: both derive the six-cell `02_040` panel \
and `er_gfx::options_02_040::quit6` fail-closes when handed bytes it has already edited, so \
whichever runs second refuses. The product is the side to keep; the shell exists for profiles that \
do not load it. Tracked as bd er-effects-rs-ye3q, which is the extraction that would make both \
hosts behave identically and is not what this entry waits on."""
