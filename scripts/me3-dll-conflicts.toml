only other crate that writes game code. Its single patch is the freelist shutdown assert at \
1.16.2 `0xc57670`, which is nowhere near these three, and it reaches its address the same way \
(`resolve_call_site_rva`, window check, one byte, read back). The two are independent by address \
and identical in mechanism.

DEFAULT-OFF, WHICH IS NOT A CONFLICT ARGUMENT BUT IS WORTH KNOWING: all three patches stay \
unapplied unless a DLL-adjacent config key asks for one, so a profile that includes this shell \
without editing that file changes no byte at all."""
"er-focus-input" = """CO-LOADABLE WITH EVERYTHING, INCLUDING THE PRODUCT, and the reason is \
structural rather than a run that happened to survive: this shell INSTALLS NO DETOUR. Its entire \
