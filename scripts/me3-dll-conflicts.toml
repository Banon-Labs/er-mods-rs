the old row's evidence because the demotion has to be auditable, and because the row was demoted \
once before on weaker grounds and had to be restored.

WHAT THE ROW SAID. Six crashes, deterministic at ~30s with the product co-loaded: \
`exception code=0xc000001d (STATUS_ILLEGAL_INSTRUCTION) addr=0x140010043{game+0x10043}`, a \
MID-INSTRUCTION RIP two bytes into the game's SSE memcpy leaf at `0x140010000`, with \
`context_rcx == context_rip == 0x140010043` -- the signature of a call THROUGH A POINTER holding \
the faulting address. A bisect isolated this shell: product alone clean past 106s, \
`er-invasion-path` alone clean past 114s, this one alone +29.9s. The row correctly refused to \
demote on two clean runs in 2026-09-03, and correctly restored itself when the repeat crashed at \
`+30436ms` with a valid slot.

THE MECHANISM, found 2026-09-04. The fault is TIME-triggered, not action-triggered: five records \
land at 43.8-56.1s regardless of activity and one arrived with nothing pressed at all, so no user \
action was ever the variable. What WAS the variable is that `local_invasion_filter` reached \
Seamless's session through two MinHook detours INTO `ersc.dll`. Either detour armed faults; \
neither armed is clean. MinHook registers no unwind info for its trampolines (nothing in \
`vendor/minhook/` calls `RtlAddFunctionTable`), and `ersc.dll` is Themida-virtualised, which is \
enough to make a detour there a wild control transfer rather than a chained call.

THE FIX, and why it removes the cause instead of hiding it. `scan_for_session` \
(`crates/er-invasion-warp/src/local_invasion_filter.rs`) walks the WRITABLE sections of ersc's own \
image and identifies the session by its state signature, which is the only thing the detours \
existed to observe. `ersc_observers` now defaults FALSE. So the filter keeps working with ZERO \
detours into `ersc.dll` -- measured live: `session resolved WITHOUT hooking Seamless -- found at \
0x1801b2560 via a pointer in ersc's own writable data at 0x18021a640`.

THE RUN. 2026-09-04, autoload route, `er_quickload.dll` + `er_invasion_warp.dll` + \
`er_crash_logging.dll` + the game-installed `ersc.dll` (Seamless v2.0.1), \
`local_invasion.enabled = true`, character LGS: 600 seconds, `fault_records=0 panic_lines=0 \
hang_report=false process_alive=true`. That is TWENTY TIMES the ~30s window every historical crash \
landed inside.

WHAT THIS RESTS ON, stated plainly: ONE 600s run, plus an identified and removed cause. The \
2026-09-03 demotion failed because it had clean runs and no mechanism; this one has the mechanism. \
If it is still wrong the failure is loud and immediate -- `0x140010043` inside the first minute -- \
so a single launch re-falsifies it. Restore the `[[conflict]]` row if that happens, and do not \
re-demote on absence alone.

IT NOW DRAWS AN IMGUI OVERLAY, added with the settings panel. Exactly one `Present` hook exists in \
the process regardless of how many shells draw, because this one joins the same arbitration \
`er-invasion-path` and `er-net-effects` use: it probes for a host, claims \
`claim_overlay_ownership()` only if there is none, and otherwise registers through \
`er_overlay_register_guest_v1` at ABI tag `0x0903` and draws inside the host's frame. In every \
profile that carries more than one overlay shell this one is the GUEST -- `er_build_watermark.dll` \
and `er_invasion_path.dll` both load ahead of it in `release-invasion-warp.me3` -- so its hudhook \
install path does not run at all there.

IT ALSO CHAINS ONE MORE HANDLER ONTO THE MOUSE `IDirectInputDevice8::GetDeviceState`, through \
`er-dinput-suppress-core` and the `er-hook` union, never a bare `MhHook`. It blanks `rgbButtons[0]` \
only while its own panel owns the pointer, so a click on the panel is not also a weapon swing. That \
entry already carries `er-net-effects`, `er-quickload` and `er-enemynpc-effects`; a fourth chained \
handler is what the union is for, and two handlers blanking the same byte is idempotent. Each DLL \
keeps its OWN `POINTER_OVER_OVERLAY` static -- one shared bool would be last-writer-wins between \
two overlays and the click would reach the game about half the time."""

"er-diag-harness" = """Co-loadable with the product, and co-loadable is the whole point: this \
shell exists to carry five detours the product USED TO install unconditionally, so every one of \
its addresses is one the product has stopped claiming. `0x21bbf0` (the sole `MsbFileCap::msbResCap` \
writer), `0xaf1800` (`CS::MoveMapListStep::STEP_LoadListWait`), and `0xe06490` / `0xe05fb0` / \
`0x836f30` (the DLC virtual-root blank, refill and job body).

FOUR OF THE FIVE HAVE ONE CLAIMANT. THE FIFTH DOES NOT, AND THIS ENTRY SAID OTHERWISE UNTIL \
2026-08-30. The sentence that stood here -- "No other shell in this table names any of the five" -- \
was FALSE of `0x836f30`: `er-reload-trace` detours the same prologue as \
`HookSpec { name: "map_request_do_836f30", rva: 0x836f30, detour: hook_map_request_do, .. }`, a \
BARE `rva:` field with no constant name at all. Nothing keyed on NAMES could contradict the claim, \
because the two sides shared an address and no spelling; `check-shared-hook-rvas.py` only found it \
once its collision key became the RESOLVED VALUE. The pair is now recorded as a [[shared]] row \
above, and this sentence is kept as a warning rather than deleted: a "no other shell names this" \
assertion is exactly the kind that a name-keyed scan cannot check and a reader cannot audit.

It cannot corrupt a co-load in the ways the other rows describe. It installs no D3D12 Present or \
compositor hook, drives no input, and reads no product static: every value in its log lines comes \
from GAME memory through `er_game_base::filecap`. Its `0x21bbf0` / `0xaf1800` / `0xe06490` / \
`0xe05fb0` detours call their own MinHook trampoline and return the native result verbatim; the \
`0x836f30` job trace no longer owns a MinHook instance at all and chains through the union (see \
the [[shared]] row). It links only `er-hook` and `er-game-base` (tier A), so it is not a second \
owner of any feature crate's state machine -- deliberately, since that is the `duplicate-owner` \
failure mode above.

ONE SOFT COUPLING IS DOCUMENTED RATHER THAN CONFLICTING. `er-title-flow`'s DLC-root self-heal \
prefers the refill trampoline over the refill's RVA so it does not re-enter our detour; Rust \
statics are per-DLL, so with the trace here the product's copy stays 0 and the heal takes the \
`game_rva` fallback it already carried. Product-only: the un-detoured native, identical behaviour. \
Product + harness: the heal enters this detour, which samples the roots and forwards -- one extra \
log line, no recursion, and the trace now also sees the heal's refill."""
"er-armament-icons" = """Co-loadable with the product. Its TilePopulate, GFx-parse (AOB-scanned) \
and FileOpener::OpenFile (vtable-resolved) detours are on prologues no other shell claims, so they \
stay on its own MinHook instance. The ONE prologue it shares -- the Scaleform file-open wrapper -- \
is registered through `er_hook::register_shared_hook`, which chains it into the product's single \
union rather than installing a second instance; see the [[shared]] entry above for the measurement \
that forced this."""
"er-refill-all" = """Co-loadable with the product and with every other shell here. The two \
prologues it detours are `CS::DepositoryDialog`'s own constructor and destructor -- it brackets that \
one dialog's lifetime and acts only while the latch is open -- and no other shell in this table \
claims either. Its own module header records WHY those two and not the obvious one: the first \
version hooked `MenuWindow::Update`, the prologue every dialog in the game inherits, which MinHook \
binds one detour to and which the product and `er-armament-icons` already proved is the exact way \
to end up `installed = true, hits = 0`. It reads a pad/keyboard combination of its own, writes only \
the storage box's refill-state vector through the game's own native, and hooks nothing on the \
render or Scaleform paths."""

"er-build-watermark" = """Co-loadable with everything, because it detours nothing at all. It \
installs one hudhook/imgui DX12 overlay, reads the loaded-module list through GetProcAddress, and \
draws text; it writes no game memory, claims no prologue and takes no input. The one thing that \
could have conflicted -- a second imgui context on the game's swapchain, since er-net-effects \
also runs a hudhook overlay -- is REAL, and a note here once claimed the \
opposite. That note said a 2026-08-25 measurement showed both overlays rendering side by side; \
the same day, the user's live session proved otherwise -- this shell logged `first render \
display_width=3840 rows=14` while er-net-effects sat at hudhook_render_count = 0, its \
interactive bar invisible since #336 and no error logged by anyone. Two Hudhook::apply() calls \
in one process double-hook Present, and the second one loses silently. RESOLVED by \
er_build_watermark_core's `overlay_host`: the first module to claim the named mutex \
(Local\\er-quickload-build-watermark-owner) HOSTS the imgui context, every other overlay module \
registers a draw callback through the `er_overlay_register_guest_v1` export and is dispatched \
once per frame, and both DLLs pin the same hudhook so the `ui` pointer crossing the DLL boundary \
is the type both were built against (OVERLAY_ABI_TAG refuses the pair if that stops being true). \
Load order no longer decides who is visible."""
"er-better-refills" = "Hooks the native storage-box toggle and calls the game's own refill; no shared prologue."
"er-enemynpc-effects" = """Co-loadable with the product. It detours exactly one address -- \
the DirectInput keyboard `GetDeviceState` slot -- through `er_hook::register_shared_hook`, so the \
product's single MinHook instance owns the prologue and the handlers chain; see the [[shared]] \
rows above. Everything else it does is a read plus the game's own ApplySpEffect/RemoveSpEffectById \
on a FrameBegin walk of WorldChrMan's ChrSets."""
"er-npc-possess" = """Co-loadable with every other shell here. It claims exactly ONE prologue and \
nothing else: `CS::CSFeManImp::UpdatePlayerComponents` (1.16.2 `0x140772a80`, 1.17 `0x140773900`), \
the per-frame HUD vitals pass, detoured so the HP/FP/stamina bars read the possessed creature \
instead of the body the player walked in as. No other shell in this suite hooks that function or \
its caller. Everything else it does happens from one recurring `FrameBegin` task.

THE ONE OTHER HOOK, and only once the player asks for something to be DRAWN: hudhook's DX12 \
`Present`, through `er_build_watermark_core::overlay_host` -- the same host-or-guest arbitration \
er-build-watermark, er-net-effects and er-invasion-path go through, so the process still has \
exactly one `Present` hook whoever loaded first. Two things ask, and both are still lazy: opening \
the in-game creature picker, and starting a possession (which puts the attack-set panel in the \
corner -- `[hud] pages`, on by default). Pressing nothing and possessing nothing means installing \
nothing. Both panels draw from `crate::overlay`, which owns the single join; the second trigger \
exists because `[target] mode = \"lock_on\"` is the default and never opens the picker, so a \
possession-only session would otherwise have no overlay to draw the panel on. `Present` is a \
swapchain vtable slot rather than a game prologue, so it needs no [[shared]] row -- the overlay \
host is the arbitration.

WHAT IT DOES FROM THAT TASK, kept current as the layers land -- the sentence above is the \
co-loadability claim and the ones here are what it rests on, so they are not the same claim twice. \
It polls `GetAsyncKeyState` and `XInputGetState`; while something is possessed it WRITES game \
memory (`ChrCtrl+0x3b0`, `WorldChrManDbg+0xb8`, `ChrExFollowCam+0x468`, and a handful of fields on \
two `ChrIns`); and it RESOLVES THREE game function addresses, all through `game_rva_named` so an \
unrecognised build goes quiet rather than jumping into whatever now occupies those bytes. Those \
three are `PlayAnimationByBehaviorName` (the 2,252 dodges, which have no `W_Event%04d` name for the \
field write to spell), `WorldChrManImp::SpawnDynamicChr` and `WorldChrManImp::RemoveChrIns` (the \
`mode = "spawn"` creature, created and removed through the same entries `CSTalkDynamicChrCtrl` \
uses). Resolving an address to CALL is not claiming a prologue: nothing is patched and no other \
shell's detour is disturbed. Grabs added neither an address nor a detour -- a grab is an ordinary \
attack whose `AtkParam_Npc.throwTypeId` is non-zero, and the game's own throw system does the \
rest. Every write is made only while something is possessed and is undone by `possess::teardown` \
on release, death, despawn and `DLL_PROCESS_DETACH`.

THE ONE PARAM ROW, AND WHY IT IS NOT THE KIND OF PARAM EDIT THAT BREAKS SEAMLESS. The camera layer \
patches ONE `LockCamParam` row IN MEMORY for the length of a single possession -- three floats -- \
and writes the row's original bytes back on release. `regulation.bin` on disk is never opened, so \
this is not the file-level regulation edit that makes Seamless refuse a session. The row is chosen \
by `[camera].param_row` (1000 by default, one of the 73 rows the shipped regulation never \
references) and is re-checked at every possession against the LIVE `NpcParam.lockCameraParamId` and \
`RideParam.rideCamParamId` tables, so a player running a regulation mod that DOES use it gets a \
refusal naming the row rather than a stolen camera. It is still a shared write: a second mod \
patching the same row while a possession is in flight would fight it, which is exactly what the \
setting exists to resolve.

THAT PROLOGUE IS UNSHARED, AND CHECKED RATHER THAN ASSUMED. No other shell in `me3_shells` \
detours `UpdatePlayerComponents` or its sole caller `CSFeManImp::Update` (1.16.2 `0x140771bd0`): a \
scan of every crate for those four RVAs -- both builds, both functions -- returns only \
er-npc-possess itself. The three shells that live nearest this neighbourhood do not touch it. \
er-armament-icons READS a param offset it ground-truthed against this function's skill-icon \
builder and hooks the GFx tile/file-open paths instead; er-player-name-filter hooks the name \
PRODUCERS reached from `CSFeManImp::UpdateEnemyTags`, a sibling pass; er-save-suppress only \
observes `CSFeManImp::Update` in prose. `audit-1170-hook-targets.py` OVERLAP is what keeps that \
true against a future addition landing within 16 bytes.

IT IS A BARE `MhHook` ON PURPOSE, AND MUST STAY ONE. The function's signature is \
`void UpdatePlayerComponents(CSFeManImp*, float)` -- Ghidra's recovered signature, confirmed in \
the prologue (`movaps xmm6,xmm1` feeding a `subss` against a delta-time accumulator) and at the \
call site (`movaps xmm1,xmm6` before the call). `er_hook`'s `UnionFn` is four `usize`s and its own \
docs say "Not for float-arg or >4-stack-arg targets", so routing this through the hook union would \
let the compiler clobber `xmm1` before the trampoline ran and feed the HUD's timing accumulator \
garbage. If a SECOND DLL ever wants this prologue, the fix is not to move this one into the union \
-- it is to widen the union to a float-carrying signature first, and add a [[shared]] row here.

THE OTHER THING THAT COULD HAVE CONFLICTED, AND WHY IT DOES NOT. Three shells already detour the \
DirectInput keyboard `GetDeviceState` slot -- er-quickload, er-net-effects and \
er-enemynpc-effects -- through the hook union, recorded in the [[shared]] rows above. A fourth \
claimant is exactly the shape of the collision this table exists for, so this DLL deliberately \
does not become one: it needs to OBSERVE a keypress, not SUPPRESS it, and polling from the game's \
own frame task answers that without touching the prologue. `er-refill-all` reads its hotkey the \
same way for the same reason.

WHAT WOULD CHANGE THAT. A later layer of this mod may need to take an input away from the game \
rather than merely see it -- driving a possessed character means the player's stick must stop \
steering the Tarnished. That is a `GetDeviceState` claim, and when it lands it must go through \
`er_hook::register_shared_hook` (never a bare `MhHook`, which is a second MinHook instance on a \
prologue three DLLs already share) and gain a [[shared]] row here.

HOTKEY DEFAULTS ARE NOT SHARED WITH ANOTHER SHELL. Keyboard F9 and pad LS+RS; er-refill-all ships \
Select+Start with no keyboard default, er-enemynpc-effects ships ctrl+alt+c. All three are \
re-bindable in their own TOML while the game runs, which is the whole reason er-hotkey-config \
exists. The picker adds F10 plus the four arrow keys and ships every pad binding EMPTY, which is \
the same no-suppression fact stated as a default: it can see those keys but cannot take them from \
the game. Whether they collide is a judgement rather than a reading of Elden Ring's binding \
table, which is why all five are rebindable while the game runs."""
"er-net-effects" = """Keyboard-selected network SpEffects. Its DirectInput keyboard and mouse \
`GetDeviceState` detours go through `er_hook::register_shared_hook` (see the [[shared]] rows \
above); nothing else it installs is claimed by another shell."""
"er-hotkey-conflicts" = """Co-loadable with everything, and the one shell that would be \
self-refuting if it were not. It is a passive observer: it detours the input-read APIs \
(`GetAsyncKeyState`, `GetKeyState`, `GetKeyboardState`, `RegisterHotKey`, `SetWindowsHookExA/W`, \
`XInputGetState`, and the DirectInput device-state slot), and EVERY detour calls the rest of the \
chain first and returns its value byte for byte. No input is swallowed, altered or injected; no \
param row is patched (which breaks Seamless invasions); no game memory is written; and it never \
`LoadLibrary`s a module that was not already in the process.

The one prologue it shares -- the DirectInput `GetDeviceState` slot, claimed by three other shells \
-- is registered through `er_hook::register_shared_hook_with_budget`, so the product's single \
MinHook instance owns it and the handlers chain. See the `[[shared]]` rows above. The user32 and \
XInput prologues it also takes are claimed by no other shell in this workspace, and they go \
through the same registrar so a third-party DLL detouring one of them is chained rather than \
trampled.

It draws through `er_build_watermark_core`'s `overlay_host` as a GUEST ONLY and never calls \
`Hudhook::apply()`, even when nothing else hosts: a one-line diagnostic is not worth owning the \
swapchain, and a second `Present` hook silently disables the first. Loaded with no overlay host in \
the profile it simply draws nothing, and says so in its log.

The two things it READS are `K32EnumProcessModules` (to name the module a call came from) and the \
game's own `CSPcKeyConfig` binding table at `GLOBAL_CSPcKeyConfig+0x440` (to check a mod's key \
against the player's configured bindings). Both are loads through the fault-safe reader."""
"er-crash-logging" = "First-chance exception handler only. The product does not link er-crash-logging-core, so this is the sole crash logger in the process."
"er-inventory-sort" = "Applies equipment-menu sort defaults once per process; installs no detour."
"er-invasion-path" = """Co-loadable with everything, because it detours nothing at all and \
writes no game memory. It reads WorldChrMan's player ChrSet plus CSCamera, calls two engine \
QUERIES -- CSPhysWorld::CastRay for line of sight and the CSHkAiWorld navmesh path request \
(FUN_140bddfe0 / FUN_140bdec90 / FUN_140bdf610, the same request ring CS::CSAiFunc uses) -- and \
draws lines. It claims no prologue, patches no param (which is what breaks Seamless invasions), \
injects no input and opens no socket. Like er-build-watermark it draws through \
er_build_watermark_core's `overlay_host`, so it HOSTS the process's single imgui context only if \
nothing else has claimed it and otherwise registers a guest callback through the \
`er_overlay_register_guest_v1` export; either way there is exactly one Present hook in the \
process. The one thing it shares with the game rather than merely reading is the AI world's path \
request ring, which is mutex-guarded by the engine and is consumed by every NPC in the map -- one \
in-flight request per target, drained on the frame it completes, is the same traffic a handful of \
extra NPCs would make."""
"er-player-name-filter" = "Hooks SessionManagerPlayerEntryBase::Copy only; er-quickload no longer carries this hook, and the standalone DLL byte-checks the 1.16.2 prologue before installing."

"er-save-picker" = "Detects the product DLL and stays inert when it is present."
"er-seamless-bugfixes" = """Own MinHook instance, but on SpecialEffect::HasSpecialEffectId \
(0x4f9940) and SpecialEffect::Apply (0x4fa8e0) -- prologues no other DLL in this repo hooks \
(searched repo-wide). It cannot use the er-hook union: that handler type carries four register \
arguments only, and SpecialEffect::Apply passes four more on the stack. Instead it byte-checks each \
prologue immediately before hooking, so an entry another MinHook instance already claimed fails the \
comparison and disarms with a log line rather than trampling a trampoline. Both detours are naked \
stubs that tail-jump to the original for every non-null container, so a co-loaded run is \
byte-for-byte vanilla unless the null case occurs."""
"er-telemetry" = "Read-only oracles on a FrameBegin task; installs no hooks."

# ---------------------------------------------------------------------------
# LOADED WHENEVER THE PRODUCT IS, whether or not this branch touched the crate.
#
# `er-dll-closure.py` selects DLLs by asking which crates this branch changed, which is the
# right question for "what is this run testing" and the wrong one for "what does the player
# expect to be playing". A branch that edits only `crates/er-quickload` closes over exactly
# one shell -- measured, not assumed -- so every companion silently leaves the profile.
# That is fine for a shell whose whole purpose is to test itself, and wrong for a gameplay
# feature the user has asked to have on.
#
# So this table is the standing half of `--with`: the caller does not have to name these,
# and the closure adds them after it has decided what the diff reached. It is deliberately
# the mirror image of [opt_in_only] above -- one withholds consent, one records that consent
# was given -- and an entry in both is refused by `check-me3-dll-conflicts.py`.
#
# It is NOT an override. An entry here still passes through conflict ranking, so a DLL that
# conflicts with the product is still dropped and still reported under EXCLUDED, and
# `--without <package>` still removes it. A reason is mandatory and must say who asked and
# when, because "it is on by default" is a decision someone made rather than a property of
# the code.
#
# CONSUMED BY  scripts/er-dll-closure.py  (unions these into every closure)
# GATED BY     scripts/check-me3-dll-conflicts.py
# ---------------------------------------------------------------------------
[always]
# Empty from 2026-09-11 to 2026-09-20. Its only member had been er-lockon-filter, and that
# product was deleted by user directive; the research it carried is in
# docs/recon/lockon-filter-findings.md. The mechanism was never removed and stayed gated --
# check-me3-dll-conflicts.py and er-dll-closure.py --selftest both cover it against
# synthetic tables -- so an empty table was a table with no members rather than a
# feature nobody checks any more.
"er-crash-logging" = """A run that faults without this DLL leaves NOTHING: the process vanishes, \
the reaper removes the staged files, and the artifact directory holds a log that simply stops \
mid-sentence. Every other shell installs `er_game_base::panic_report`, which catches a Rust panic \
and not an access violation -- and an access violation is the failure these DLLs actually produce, \
because they detour the game.

Measured 2026-09-20 on run br-20260920-170445-6369: `er-quit-menu` alone in the profile, the \
player pressed the System>Quit rows, the game died with the save picker open, and the only record \
was `er-quit-menu.log` ending inside a live ProfileSelect. No fault address, no module, no stack, \
nothing to map back to a function -- so the crash could not be attributed at all and the run had to \
be repeated. The DLL was not withheld by any rule: `er-dll-closure.py` selects what the diff \
touched, and a passive recorder is never what a diff touches.

It costs nothing to carry. It is `compatible` against every entry in this table -- a first-chance \
exception handler that installs one vectored handler and writes a file -- and it is the one package \
whose absence is only discovered when it is already too late to add it."""

# Two hosts arming the Quit tab's row router is one router too many, whichever rows each carries.
# A host can clone nothing -- the Save Game row's take-over shape arms `RowSet::NONE` -- and still
# register an action table and put its handlers on the union, and `er-quit-menu-core`'s statics are
# per DLL, so the two tables disagree about who owns the first row's press.
# RESOLVED 2026-09-13 by `crates/er-quit-menu-core/src/row_registry.rs`, and this is where the
# row shells used to be declared `duplicate-owner` against each other.
#
# WHAT IT SAID. Each cdylib links its own copy of `er-quit-menu-core`, so `ROW_SET`, `ROW_ACTIONS`
# and `ARM_ONCE` were per DLL: two hosts arming the Quit tab built two row tables claiming the same
# native indices, and a press resolved against whichever the routing detour reached. Run
# br-20260913-135314-4804 is the measurement -- `Return to Desktop=#5:Some(Ours(GenerateBuildLink))`
# in the product's table while `er_quit_menu.dll` carried the row that action belongs to.
#
# WHY IT IS NO LONGER TRUE. `arm` now elects one owner per process through a named shared mapping
# and every later caller registers its rows and flows through the owner's `er_quit_rows_register`
# export, which merges them into the one table. That is the same shape `er-hook` uses for detours,
# except elected by arrival order rather than by DLL name -- rows have no designated product, since
# a build may carry any subset of them or none.

# THE FOUR PAIRS THAT WERE MISSING, found 2026-09-19 while a user asked why the installer let
# them tick `Quickload` and another Quit-row mod at the same time.
#
# The rule, and it is not invented here -- it is read back off the four pairs already declared
# above: two shells that both call `er_quit_menu_core::row_cloner::arm` AND supply the same
# `QuitRowActions` flow cannot share a process. Measured flows per shell, from the `Some(...)`
# sites each crate's DEFAULT build compiles -- which is the build every shipped artifact is,
# since `scripts/er-build-dlls.sh` passes neither `--features` nor `--no-default-features`:
#
#   er-quickload            open_profile_load_dialog, open_save_picker_menu, save_game_start_flow,
#                           save_game_as_start_flow, save_game_request_save_only,
#                           note_drive_strip_click_event
#   er-quit-menu            every one of them, since 2026-09-20: it supplies the flow for each row
#                           its config file selects, and the file can select all five
#
# The last line was three lines until 2026-09-20, one per merged shell, and one of them was wrong
# for a day. `er-save-game-row` supplied `save_game_start_flow` only under
# `--features hijack-quit-row` while its manifest read `default = []`, so no shipped artifact
# carried that spelling; the default build cloned a row and supplied `save_game_as_start_flow`
# instead. The gate matched the feature-gated name because it read crate text without regard for
# `cfg`, and it could not have matched the right one either -- neither `save_game_as_start_flow`
# nor `save_game_request_save_only` was in its field list. Both halves are fixed in
# `scripts/check-quit-row-flow-overlap.py`: the field list is now parsed out of `QuitRowActions`
# itself, and each crate is read as its default feature closure. The merged shell makes the same
# question harder rather than easier -- its flows are chosen at runtime, so source text reads as
# though every flow is supplied, which is the safe direction for this rule and the wrong direction
# for a table that wants to say "only in this configuration" (bd er-effects-rs-38gi).
#
# Every pair already declared shares at least one flow, and every pair that shares a flow is
# declared. Two pairs among the row shells shared none -- disjoint rows, disjoint flows -- and were
# declared anyway on a second mechanism this rule cannot see; both packages are gone now and the
# note at the end of this file keeps what they measured.
#
# WHY A SHARED FLOW IS THE CONDITION. `row_registry::elect` fixed the row TABLE in 2026-09-13:
# the loser delegates through `er_quit_rows_register` and one merged table results. What it did
# not fix, and cannot, is that each cdylib links its own copy of the core's statics. Run
# br-20260917-205031-edd3 measured the consequence on er-quickload X er-quit-menu: the owner
# answered the second registration `open_profile_load_dialog=offered-but-already-held`, and the
# product's own activate hook then declined because `flow_active` is a latch in the PRODUCT's
# copy, set only when the product opens the picker. The shell had opened it in its copy. The row
# looked armed, the press forwarded to the game, and the player got an in-world load instead of
# the save-safe switch -- no crash, no error, the wrong load.
#
# So the failure needs two hosts offering the SAME flow, which is exactly what these four are.
# They are derived from that measured mechanism rather than each separately reproduced; the
# mechanism is the per-cdylib static, which does not care which of the two hosts is which.
# `scripts/check-quit-row-flow-overlap.py` re-derives the rule from source on every run, so a
# new row shell, or a new flow on an existing one, cannot land without being classified.

# `er-quit-menu` X `er-quit-rows` was the fourth of these and went with the package on 2026-09-20.
# It said what the three above say -- both armed near-`RowSet::ALL`, both supplied
# `open_profile_load_dialog` and `open_save_picker_menu`, and the loser's flows came back
# `offered-but-already-held` while its activate hook read a `flow_active` latch the winner never
# set -- and it is `er-quickload` X `er-quit-menu` above, with the product swapped for a copy of it.

# THE THREE PAIRS THE FLOW RULE CANNOT SEE, read out of the source on 2026-09-19 beside the four
# above. Two are row shells whose flows are disjoint; the third is not a row pair at all.
#
# WHAT TWO ROW SHELLS SHARE WHEN THEIR FLOWS DO NOT. Every standalone row host derives the
# six-cell `02_040_optionsetting` Quit grid, and `er_gfx::options_02_040::quit6` fail-closes when
# it is handed bytes something has already derived. The doc comment on
# `gfx_swap::install_quit_menu_gfx_swap_hook` says exactly that, and names this table as the thing
# that keeps one deriver per process: "two derivers of one movie is not a race to be won". Every
# one of them also calls `profile_row_chrome::install_profile_row_populate_hooks`, which is a bare
# `MhHook::new` on `PROFILE_ROW_POPULATE_RVA` (0x8757e0) and `PROFILE_CURRENT_ROW_POPULATE_RVA`
# (0x951220) -- and that function's doc comment is the clearest statement of why these rows have
# to exist: "one owner per process is a property of the conflict table, not an assumption made
# here".
#
# Nothing in the core stops the second host. `FILE_OPEN_INSTALLED`, `PROFILE_ROW_POPULATE_CLAIMED`
# and the `SERVE_*` flags are per-cdylib statics, and `er_hook::register_shared_hook` resolves a
# union only out of `er_quickload.dll` by name (`PRODUCT_DLL_NAME`), so a profile carrying two
# shells and no product gives each of them `HookRoute::LocalUnion` and a MinHook instance of its
# own on the same prologue.
#
# Each of the three is read from the source cited beside it rather than reproduced on its own run.
# None of these pairs has ever co-loaded, which is why no run names them.

# THE TWO PAIRS THE MERGE DELETED, and what they were about. `er-quit-menu` X `er-save-game-row`
# and `er-quit-load-character` X `er-save-game-row` were both `[[conflict]]` rows here on
# 2026-09-19 and both packages are gone as of 2026-09-20. Their finding is not: disjoint rows and
# disjoint flows still made two owners of one movie and one pair of prologues, which is the case
# the flow rule above cannot see and the reason it must not be read as a co-load licence.
#
# Each shell derived the six-cell `02_040` Quit grid -- one through `arm::arm_standalone`, which
# served `GfxServeSet::ALL_PICKER_KEYED` for every caller, the other through
# `install_gfx_swap_hook_for` with `quit_grid: true` on top of `PICKER_KEYED` -- so whichever ran
# second was handed already-derived bytes, `quit6` fail-closed, and the tab it served was the
# vanilla two-cell one with the other host's cloned rows indexed into cells that did not exist.
# Each also installed the two row-populate detours with a bare `MhHook` on `0x8757e0` and
# `0x951220`, and each took its own MinHook instance on the Scaleform file-open prologue. A
# narrower row set narrowed none of that: all three are properties of opening a ProfileSelect at
# all.
#
# One shell now arms every row, and `arm_standalone` derives its serve set from the row set rather
# than serving `ALL_PICKER_KEYED` unconditionally -- so a configuration that clones no row no
# longer widens the grid either (bd `slim-quickload-still-widened-the-quit-grid-2026-09-12`).

# The third of the 2026-09-19 pairs was `er-quit-rows` X `er-save-disable`, deleted 2026-09-20 with
# the package. It was the `er-quickload` entry against the same shell, inherited by copying that
# source: both called `er_save_suppress::install` from their own statically linked copy, and
# `install` detours `SL_ENQUEUE_SAVE_JOB_RVA` (0xe6fb50) and `SL_POLL_SAVE_STATUS_RVA` (0xe6e430)
# with a bare `MhHook::new`, so whichever installed second overwrote the other's trampoline. Both
# halves of that survive on the product's own row above, which is the row to read.
#
# What does NOT survive, and is the reason to say this out loud rather than let the pair vanish:
# `er-quit-menu` links `er-quit-menu-core`, whose save flow reaches `er_save_suppress` too, so the
# merged shell inherits this pair the way it inherited the `er-reload-trace` one. It is declared
# above, at `er-quit-menu` X `er-save-disable`.
