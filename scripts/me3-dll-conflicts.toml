[[conflict]]
a = "er-effects-rs"
b = "er-save-disable"
kind = "hook-collision"
reason = """Both carry their own MinHook instance and detour the SAME prologues \
(0x140e6fb50 / 0x140e6e430), so each overwrites the other's trampoline. \
er_save_disable additionally suppresses every save write, so a run that loads it \
cannot produce save-path evidence at all."""
evidence = "crates/er-save-disable/src/lib.rs:23; crates/er-save-suppress/Cargo.toml:11"

[[conflict]]
a = "er-effects-rs"
b = "er-loading-portrait"
kind = "present-compositor"
reason = """Double D3D12 Present hook. The product already links er-loading-portrait-core, so \
the standalone shell installs a second compositor over the same swapchain. The shell's own \
header states it must NEVER be loaded alongside er_effects_rs.dll."""
evidence = "crates/er-loading-portrait/src/lib.rs:11"

[[conflict]]
a = "er-effects-rs"
b = "er-loading-bar"
kind = "present-compositor"
reason = """Unconditionally installs a second Present compositor with a SYNTHETIC demo frame \
provider, painting a fake loading bar over the product's real one. Same conflict class as the \
portrait shell."""
evidence = "crates/er-loading-bar/src/lib.rs:102"

[[conflict]]
a = "er-effects-rs"
b = "er-build-import"
kind = "duplicate-owner"
reason = """Both link `er-build-import-runtime`, and a statically linked crate's statics are \
PER DLL: two copies of the phase machine, two fetch workers, two CSTaskImp FrameBegin tasks, all \
mutating one character's inventory, equipment slots and PlayerGameData. The shell imports the \
configured `build_url` unprompted at character load while the product's System>Quit "Load Build \
from URL" row imports on demand, so the two interleave grants and stat writes with no shared \
lock -- and the shell's import can land on a character the player never asked to rebuild. \
Neither installs a detour, so this is not a hook collision: it is two owners of one mutation. \
The product DLL is the one to keep; the shell exists for profiles that do not load it."""
evidence = "crates/er-build-import/src/lib.rs:23; crates/er-effects-rs/src/experiments/startup_hooks/quit_menu/build_url_row.rs"

[[conflict]]
a = "er-effects-rs"
b = "er-input-harness"
kind = "drives-input"
reason = """DEFAULT-ON by mere presence: it writes the game's input memory every frame, so the \
user is not driving the session. Not a corruption conflict -- a truth conflict. A run that loads \
this cannot be described as user-driven, and its own header says to omit it from production \
profiles."""
evidence = "crates/er-input-harness/src/lib.rs"

[[conflict]]
a = "er-effects-rs"
b = "er-reload-trace"
kind = "diagnostic-drive"
reason = """Union-aware for hooks, but NOT passive: its rt5d diagnostic drive writes menuData+0x5d \
after a stuck-load streak, so it can advance the very state machine under test. Acceptable only \
when reload tracing IS the experiment, never in a run whose subject is something else."""
evidence = "~/Elden/main-all-dlls.me3 (annotation on the er_reload_trace entry)"

# ---------------------------------------------------------------------------
# Shells with NO known conflict at all. A reason is mandatory: "no conflict" must be a
# finding someone made, not a default that a new crate inherits by being forgotten.
#
# `er-effects-rs` is deliberately absent. It is the axis every conflict above is
# expressed against, so it is already classified by appearing in those pairs -- and
# listing it here would assert it is conflict-free, which is the opposite of true.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# CO-LOADABLE, BUT NEVER AUTO-INCLUDED. These DLLs corrupt nothing -- they would each pass
# [compatible] on the merits -- but they CHANGE WHAT THE PLAYER SEES, and a dependency-closure
# walk is not consent. `er-dll-closure.py` drops them unless the caller names them with `--with`.
#
# The failure this exists to stop, 2026-08-23: mushroom-man-runtime was classified [compatible]
# (true: it patches protector param rows, hooks nothing), so a branch that touched a crate it
# transitively depends on pulled it into the closure, and `er-run-branch.py` launched the user's
# game with a mushroom mod they had already removed by hand from their own profile. The run was
# not the run they asked for, and the only remedy was killing the session.
#
# A reason is mandatory and must say WHAT THE PLAYER WOULD SEE, not what the code does -- the
# whole point is that the code being harmless is not the question.
# ---------------------------------------------------------------------------
[opt_in_only]
"mushroom-man-runtime" = """Replaces a protector's param rows so the character wears the mushroom \
head -- a VISIBLE costume change on whatever character the run loads. Harmless to the process \
and hooks no prologue, which is exactly why it slipped in: co-loadable is not the same as \
wanted. Load it only when the mushroom IS the experiment: `--with mushroom-man-runtime`."""

"er-death-persist" = """Patches SpEffectParam / SpEffectVfxParam rows (saveCategory 5 -> 3 on \
19980/19981/19982, plus their cycle-chain and VFX flags) from a CSTaskImp task at boot. It hooks \
NOTHING -- no MinHook instance, no union entry, no VirtualProtect -- and that is precisely why it \
sat in [compatible] for so long: it cannot corrupt another DLL's trampolines, so every \
prologue-based check called it safe. It still LOCKS THE PLAYER OUT OF SEAMLESS INVASIONS.

MECHANISM. Seamless filters its lobby list on `lobby_key` with k_ELobbyComparisonEqual, and that \
key is a SHA256 fingerprint of the PARAM TABLES (BuildLobbyKey @ ersc 0xABC20). It re-derives on \
a jittered timer AFTER this DLL's boot task has run, so the PATCHED fingerprint is what gets \
published and filtered on -- and nobody else in the world has it. A search against a pool of one \
finds nobody.

MEASURED TWICE, byte-identical two days apart (2026-08-23 A/B; reconfirmed live 2026-08-25 on the \
user's own save and the full 14-DLL pack):
  with it     LOBBY KEY = 0044f570d958f07ace546a90fa62ba2044ef7c3a1f9864fb3cb336bf611965d3
  without it  LOBBY KEY = 16ca67264987f56ca821525a2f65884cedc2546cf15ca3e69292c5c394c9d4ef
With it dropped, the user invaded on the next attempt.

WHY DEFAULT-OFF RATHER THAN A [[conflict]]: nothing crashes, nothing logs an error and no \
prologue is contended, so there is no pair to rank. The failure is INVISIBLE and looks exactly \
like "no hosts online" -- the worst possible way for a DLL to arrive uninvited on a \
dependency-closure walk. Load it only when death-persistence IS the experiment, and expect not to \
invade during that run: `--with er-death-persist`."""

[compatible]
"er-diag-harness" = """Co-loadable with the product, and co-loadable is the whole point: this \
shell exists to carry five detours the product USED TO install unconditionally, so every one of \
its addresses is one the product has stopped claiming. `0x21bbf0` (the sole `MsbFileCap::msbResCap` \
writer), `0xaf1800` (`CS::MoveMapListStep::STEP_LoadListWait`), and `0xe06490` / `0xe05fb0` / \
`0x836f30` (the DLC virtual-root blank, refill and job body) had exactly one claimant before the \
move and have exactly one after it -- the claimant is just a different image now. No other shell \
in this table names any of the five.

It cannot corrupt a co-load in the ways the other rows describe. It installs no D3D12 Present or \
compositor hook, drives no input, and reads no product static: every value in its log lines comes \
from GAME memory through `er_game_base::filecap`, and each of its detours calls its own MinHook \
trampoline and returns the native result verbatim. It links only `er-hook` and `er-game-base` \
(tier A), so it is not a second owner of any feature crate's state machine -- deliberately, since \
that is the `duplicate-owner` failure mode above.

ONE SOFT COUPLING IS DOCUMENTED RATHER THAN CONFLICTING. `er-title-flow`'s DLC-root self-heal \
prefers the refill trampoline over the refill's RVA so it does not re-enter our detour; Rust \
statics are per-DLL, so with the trace here the product's copy stays 0 and the heal takes the \
`game_rva` fallback it already carried. Product-only: the un-detoured native, identical behaviour. \
Product + harness: the heal enters this detour, which samples the roots and forwards -- one extra \
log line, no recursion, and the trace now also sees the heal's refill."""
"er-armament-icons" = """Co-loadable with the product. Its TilePopulate, GFx-parse (AOB-scanned) \
and FileOpener::OpenFile (vtable-resolved) detours are on prologues no other shell claims, so they \
stay on its own MinHook instance. The ONE prologue it shares -- the Scaleform file-open wrapper -- \
is registered through `er_hook::register_shared_hook`, which chains it into the product's single \
union rather than installing a second instance; see the [[shared]] entry above for the measurement \
that forced this."""
"er-refill-all" = """Co-loadable with the product and with every other shell here. The two \
prologues it detours are `CS::DepositoryDialog`'s own constructor and destructor -- it brackets that \
one dialog's lifetime and acts only while the latch is open -- and no other shell in this table \
claims either. Its own module header records WHY those two and not the obvious one: the first \
version hooked `MenuWindow::Update`, the prologue every dialog in the game inherits, which MinHook \
binds one detour to and which the product and `er-armament-icons` already proved is the exact way \
to end up `installed = true, hits = 0`. It reads a pad/keyboard combination of its own, writes only \
the storage box's refill-state vector through the game's own native, and hooks nothing on the \
render or Scaleform paths."""

"er-build-watermark" = """Co-loadable with everything, because it detours nothing at all. It \
installs one hudhook/imgui DX12 overlay, reads the loaded-module list through GetProcAddress, and \
draws text; it writes no game memory, claims no prologue and takes no input. The one thing that \
could have conflicted -- a second imgui context on the game's swapchain, since er-net-effects \
also runs a hudhook overlay -- is REAL, and a note here once claimed the \
opposite. That note said a 2026-08-25 measurement showed both overlays rendering side by side; \
the same day, the user's live session proved otherwise -- this shell logged `first render \
display_width=3840 rows=14` while er-net-effects sat at hudhook_render_count = 0, its \
interactive bar invisible since #336 and no error logged by anyone. Two Hudhook::apply() calls \
in one process double-hook Present, and the second one loses silently. RESOLVED by \
er_build_watermark_core's `overlay_host`: the first module to claim the named mutex \
(Local\\er-effects-build-watermark-owner) HOSTS the imgui context, every other overlay module \
registers a draw callback through the `er_overlay_register_guest_v1` export and is dispatched \
once per frame, and both DLLs pin the same hudhook so the `ui` pointer crossing the DLL boundary \
is the type both were built against (OVERLAY_ABI_TAG refuses the pair if that stops being true). \
Load order no longer decides who is visible."""
"er-better-refills" = "Hooks the native storage-box toggle and calls the game's own refill; no shared prologue."
"er-charm-enemies" = """Co-loadable with the product. It detours exactly one address -- \
the DirectInput keyboard `GetDeviceState` slot -- through `er_hook::register_shared_hook`, so the \
product's single MinHook instance owns the prologue and the handlers chain; see the [[shared]] \
rows above. Everything else it does is a read plus the game's own ApplySpEffect/RemoveSpEffectById \
on a FrameBegin walk of WorldChrMan's ChrSets."""
"er-net-effects" = """Keyboard-selected network SpEffects. Its DirectInput keyboard and mouse \
`GetDeviceState` detours go through `er_hook::register_shared_hook` (see the [[shared]] rows \
above); nothing else it installs is claimed by another shell."""
"er-crash-logging" = "First-chance exception handler only. The product does not link er-crash-logging-core, so this is the sole crash logger in the process."
"er-inventory-sort" = "Applies equipment-menu sort defaults once per process; installs no detour."
"er-invasion-warp" = "ORACLE 1 only -- reads the CSAutoInvadePoint table and installs no detours."
"er-invasion-path" = """Co-loadable with everything, because it detours nothing at all and \
writes no game memory. It reads WorldChrMan's player ChrSet plus CSCamera, calls two engine \
QUERIES -- CSPhysWorld::CastRay for line of sight and the CSHkAiWorld navmesh path request \
(FUN_140bddfe0 / FUN_140bdec90 / FUN_140bdf610, the same request ring CS::CSAiFunc uses) -- and \
draws lines. It claims no prologue, patches no param (which is what breaks Seamless invasions), \
injects no input and opens no socket. Like er-build-watermark it draws through \
er_build_watermark_core's `overlay_host`, so it HOSTS the process's single imgui context only if \
nothing else has claimed it and otherwise registers a guest callback through the \
`er_overlay_register_guest_v1` export; either way there is exactly one Present hook in the \
process. The one thing it shares with the game rather than merely reading is the AI world's path \
request ring, which is mutex-guarded by the engine and is consumed by every NPC in the map -- one \
in-flight request per target, drained on the frame it completes, is the same traffic a handful of \
extra NPCs would make."""
"er-player-name-filter" = "Hooks SessionManagerPlayerEntryBase::Copy only; er-effects-rs no longer carries this hook, and the standalone DLL byte-checks the 1.16.2 prologue before installing."
"er-quit-menu" = """System>Quit harness. Its detours route through `er_hook::register_union_hook` \
rather than a bare `MhHook`, and -- the part that actually matters -- none of its targets is claimed \
by another shell, which `check-shared-hook-rvas.py` re-proves on every run. Note that the union alone \
would NOT be enough if one were: `register_union_hook` unions handlers within ONE DLL, because its \
statics and its MinHook instance are per-DLL. Crossing images takes `register_shared_hook`."""
"er-save-picker" = "Detects the product DLL and stays inert when it is present."
"er-seamless-bugfixes" = """Own MinHook instance, but on SpecialEffect::HasSpecialEffectId \
(0x4f9940) and SpecialEffect::Apply (0x4fa8e0) -- prologues no other DLL in this repo hooks \
(searched repo-wide). It cannot use the er-hook union: that handler type carries four register \
arguments only, and SpecialEffect::Apply passes four more on the stack. Instead it byte-checks each \
prologue immediately before hooking, so an entry another MinHook instance already claimed fails the \
comparison and disarms with a log line rather than trampling a trampoline. Both detours are naked \
stubs that tail-jump to the original for every non-null container, so a co-loaded run is \
byte-for-byte vanilla unless the null case occurs."""
"er-telemetry" = "Read-only oracles on a FrameBegin task; installs no hooks."
