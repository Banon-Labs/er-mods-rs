# er-invasion-warp-core -- invade where YOU are standing, first try.
#
# Drop this in as:  ...\steamapps\common\ELDEN RING\Game\er-invasion-warp.toml
# (overwrite the file the DLL wrote on first run -- it is the same schema, just shorter)
#
# Edits take effect immediately. The file is re-read about once a second; no restart.
#
# HOW IT WORKS NOW. The mod asks Steam only for hosts at the place you are standing, so the match
# that arrives is already the right one. It used to do the opposite -- take whatever Seamless sent
# and cancel the wrong ones -- which worked but spent a real connection on every refusal and took
# five matches to land one. That filter was deleted on 2026-09-15. If you are reading an older doc
# that tells you to "let it grind", it is describing the version before this one.
#
# THE COST, and it is the whole reason this is not the default: the query filters on a key only
# this DLL publishes, so while search_by_location is on you will NOT see hosts who are not running
# it. Whoever you want to invade needs this DLL too.
#
# HOW TO USE IT, in game:
#   1. Walk to the place you want to invade. Where you stand IS the target -- nothing to type.
#   2. Search for invasions the normal Seamless way.
#   3. If nothing answers, nobody with this DLL is hosting there. Widen search_radius, or turn
#      search_by_location off to meet the ordinary population again.
#
# WHAT IT GUARANTEES: the PLACE, not the PERSON. If a stranger is standing where your friend is,
# you invade the stranger and the result is identical.

[local_invasion]

# Master switch for the location feature.
enabled = true

# Ask Steam for one location instead of taking whoever answers. This is the feature.
search_by_location = true

# How far out to look, in rings of map tiles. 0 is exactly where you stand -- start here, because
# it is the only setting that means "her, at this spot". 1 adds the eight tiles around you, 2 the
# ring beyond that, 3 is the cap.
search_radius = 0

# When the rings are spent, keep asking for the last tile rather than quietly falling back to
# an unfiltered query. Turn it on if you would rather take anybody than nobody.
widen_to_anywhere = false

# Announce what the search is doing on the game's own message banner -- which place is being
# asked for, and where you landed. Worth having on the first time.
reject_notice = true

# Leave false to stay visible to ordinary Seamless players. True cuts you off from everyone
# without this DLL, for hosting as much as for invading, and it is symmetric and absolute.
only_players_with_this_mod = false

# Places you have marked with the keys below. One mark is what search_by_location aims at; with
# none it aims at the map you are standing in. An exclusion stops it entirely.
# Empty is correct for "just wherever I am standing right now".
allowed_blocks = []
blocked_blocks = []

# The mark keys, by name. Recognised: Insert Delete Home End PageUp PageDown Backspace Tab
# Enter Escape Space Left Up Right Down PrintScreen ScrollLock Pause CapsLock, F1..F24, any single
# letter or digit ("K", "7"), punctuation by symbol or name, keypad KP_0..KP_9 and friends.
# A name that is not recognised is reported in the log and the previous key stays in force.
#
#   mark_key    "invade here"  -> allowed_blocks
#   unmark_key  "not here"     -> blocked_blocks
mark_key = "Insert"
unmark_key = "Delete"

# Flips `enabled` and saves. F4 opens the in-game settings panel, which shows every key in this
# file and writes each change straight back here.
enable_toggle_key = "F3"
settings_key = "F4"
