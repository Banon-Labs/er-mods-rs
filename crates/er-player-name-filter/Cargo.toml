[package]
name = "er-player-name-filter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_player_name_filter"
crate-type = ["cdylib", "rlib"]

# Standalone ME3-loadable DLL for filtering remote player display names copied through
# CS::SessionManagerPlayerEntryBase::Copy. It intentionally has no dependency on the
# product er-effects-rs DLL or config surface.
[dependencies]
er-game-base = { path = "../er-game-base" }
regex = "1"

[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }

[target.'cfg(windows)'.dependencies]
er-hook = { path = "../er-hook" }

[lints]
workspace = true
