[package]
name = "er-cel-shade"
version = "0.1.0"
edition = "2024"
publish = false

# Cel shading for Elden Ring as one me3 native: it swaps the pixel shader of five lighting and
# tonemap passes for posterizing ports at D3D12 pipeline creation, and an in-game menu (F6) tunes
# them live. Works on Windows and under Proton alike, because it replaces the DXIL the game hands
# D3D12 rather than anything below it.
[lib]
name = "er_cel_shade"
crate-type = ["cdylib", "rlib"]

[dependencies]
er-game-base = { path = "../er-game-base" }

[target.'cfg(windows)'.dependencies]
er-hook = { path = "../er-hook" }
# The one-imgui-host-per-process arbitration: the menu draws as a guest of whichever overlay shell
# hosts, and hosts only when none does, so exactly one `Present` hook exists in the process.
er-build-watermark-core = { path = "../er-build-watermark-core" }
# Taking the mouse and the keyboard from the game while the menu is open, chained on the shared
# `GetDeviceState` union with every other shell that blanks input.
er-dinput-suppress-core = { path = "../er-dinput-suppress-core" }
# The menu key's spelling, and the atomic rename the settings file is saved with.
er-hotkey-config = { path = "../er-hotkey-config" }
# Pinned to the same hudhook every other overlay shell carries: the `ui` pointer crosses a DLL
# boundary and `OVERLAY_ABI_TAG` refuses the pair if they ever diverge.
hudhook = { version = "0.9.2", default-features = false, features = ["dx12"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

# Assembles the byte-checked prologue of the cursor predicate from named instructions in
# `build.rs`. See `build-support/prologue_build.rs`.
[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }
