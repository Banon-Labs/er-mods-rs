# R3 in the item list cycles four views instead of three; the fourth hides the menu and draws our
# own overlay on the game's frame.
#
# Standalone shell: its own `[[natives]]` entry, no product dependency, no param edits. It draws
# as a guest of whichever module hosts the process's one imgui overlay (`er-build-watermark` is the
# usual host), so it adds no `Present` hook of its own.
[package]
name = "er-r3-view"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_r3_view"
crate-type = ["cdylib"]

[dependencies]
er-game-base = { path = "../er-game-base" }

[target.'cfg(windows)'.dependencies]
er-hook = { path = "../er-hook" }
er-build-watermark-core = { path = "../er-build-watermark-core" }
# `ttf::menu_font_ttf`: the captured `font.gfx` turned into TrueType for the overlay host.
er-gfx = { path = "../er-gfx" }
hudhook = { version = "0.9.2", default-features = false, features = ["dx12"] }

[lints]
workspace = true
