[package]
name = "er-hook"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# Shared MinHook FFI + hook union. A normal rlib: each dependent cdylib statically links
# its OWN MinHook instance (required -- the union owns exactly one instance per DLL), while
# the vendored MinHook C source is cc-compiled ONCE here instead of in three build scripts.
name = "er_hook"

# The build gate below `MhHook::new` and the union registrars. `er-game-base` tier A is a
# zero-dependency rlib and does NOT depend on this crate, so this direction adds no cycle.
[dependencies]
er-game-base = { path = "../er-game-base" }

[build-dependencies]
cc = "1.0"

[lints]
workspace = true
