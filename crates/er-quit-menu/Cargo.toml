# The cloned System>Quit rows as one ME3-loadable DLL, with the row set read from
# `er-quit-menu.toml` beside the game executable rather than compiled in.
#
# It replaces three cdylibs that differed only in which `RowSet` bits they passed to
# `er_quit_menu_core::row_cloner::arm`: `er-quit-menu` (all four cloned rows),
# `er-quit-load-character` (the character pair) and `er-save-game-row` (the Save Game row, in
# either of its two shapes). 783 lines over one 27,086-line feature crate, and every pair among
# them a declared conflict -- each cdylib links its own copy of the core, and two copies is two
# owners of one tab. See `docs/plans/menus-and-saves-consolidation.md`, phase 2.
#
# A cargo feature was the other way to merge them and is the wrong one: a player cannot change a
# feature, so the installer would have to ship a build per row set.
#
# Required product behavior is statically linked into er_quickload.dll; the shipped product profile
# never lists this DLL. This one DOES contend on real game addresses (0x920c90 AddCancelButton,
# 0x9a4670 ProfileLoad activate, 0x875590 the ProfileSelect list builder, 0x7ac720 ~MenuWindowJob,
# 0xd3ed90 the quit clean-kill, ...), several of which the product DLL also hooks. So every detour
# it installs MUST go through the `er-hook` union rather than a bare `MhHook::new`, and the union
# owner is elected at load time instead of being assumed to be the product.
# See docs/plans/save-picker-crate-extraction.md, "Hook-ownership election".
#
# It links `er-save-picker-core` with `default-features = false` so the OS-native fallback
# surface is available without (A)'s boot missing-save behavior. That isolation is
# compile-time only where the graph allows it; the runtime guarantee is that (A)'s boot
# flow arms only from an explicit entry point this crate never calls.
[package]
name = "er-quit-menu"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_quit_menu"
# `cdylib` is the ME3-loadable artifact; `rlib` keeps the tiny DLL shell testable on the
# host without pulling game deps into the test graph.
crate-type = ["cdylib", "rlib"]

[dependencies]
er-quit-menu-core = { path = "../er-quit-menu-core" }
# Tier A only (zero external deps, host-buildable): the fresh-per-process log writer, so this
# shell's log describes exactly one run instead of accumulating across launches.
er-game-base = { path = "../er-game-base" }

# Lint parity with `../fromsoftware-rs` (root `[workspace.lints]`): stock rustc + clippy lint
# set, denied. Zero violations on the shipping target
# (`cargo xwin clippy --release --target x86_64-pc-windows-msvc --all-targets`) and on the host
# build, so the deny carries no `# DEBT:` allows.
[lints]
workspace = true
