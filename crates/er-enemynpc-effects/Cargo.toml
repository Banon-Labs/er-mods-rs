[package]
name = "er-enemynpc-effects"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_enemynpc_effects"
crate-type = ["cdylib"]

# Standalone "apply one SpEffect to every loaded enemy" toggle. It owns no product state: a DirectInput
# keyboard hook for the hotkey, a FrameBegin game task for the sweep, and nothing else.
#
# Tier A only (zero external deps, host-buildable): the fresh-per-process log writer. Kept out of
# the windows-only block so the config/hotkey parsers stay covered by `cargo test` on the host.
[dependencies]
er-game-base = { path = "../er-game-base" }
# Key names, the reload decision, and the lock-free slot the DirectInput detour reads the
# hotkey out of. Host-buildable, so the config/hotkey parsers stay covered by `cargo test`.
er-hotkey-config = { path = "../er-hotkey-config" }

[target.'cfg(windows)'.dependencies]
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }
er-hook = { path = "../er-hook" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
] }

[lints]
workspace = true
