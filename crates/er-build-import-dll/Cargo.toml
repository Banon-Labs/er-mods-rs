[package]
name = "er-build-import-dll"
version = "0.1.0"
edition = "2024"
publish = false

# Thin ME3-loadable shell around the host-tested `er-build-import` crate, same split as
# er-loading-portrait / er-loading-portrait-dll. All the logic worth testing lives in the
# host crate and is proven by `cargo test`; this shell exists only to prove the two things
# that CANNOT be tested off-target: that WinHTTP reaches the API from inside the game
# process, and that the payload parses there.

[lib]
crate-type = ["cdylib"]

[dependencies]
er-build-import = { path = "../er-build-import" }
er-game-base = { path = "../er-game-base" }
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
] }

[lints]
workspace = true
