# NPC duel signs and a custom Mimic Tear. Design: docs/plans/npc-duel-signs-and-custom-mimic.md.
#
# Standalone shell, its own `[[natives]]` entry, no product dependency. Every decision lives in
# `er-npc-summons-core` and is host-tested; this crate is the game-facing half: the native calls
# (spawn, hide, place the sign), the three Mimic Tear detours, the picker overlay and the log.
[package]
name = "er-npc-summons"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_npc_summons"
crate-type = ["cdylib"]

[dependencies]
er-game-base = { path = "../er-game-base" }
er-npc-summons-core = { path = "../er-npc-summons-core" }
# A companion's build URL is parsed by the importer's own model, never a second parser.
er-build-import-core = { path = "../er-build-import-core" }

# build.rs assembles the byte-checked prologue from named instructions.
[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }

[target.'cfg(windows)'.dependencies]
# The MinHook wrapper, for the four Mimic Tear detours (BuddyGenerator, GetBuddyList,
# GetBuddyParam, CreateSummonChr). Each is a bare `MhHook` with a typed detour; all four addresses
# are recorded in `scripts/me3-dll-conflicts.toml`.
er-hook = { path = "../er-hook" }
# Only the importer's catalog (names to item ids from the game's own tables) and its reinforce
# level clamp. Its phase machine, fetch worker and game task are never started from this DLL, so
# this is not a second owner of the player's inventory.
er-build-import-runtime = { path = "../er-build-import-runtime" }
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }
# The one-imgui-host-per-process arbitration, for the duel picker. Hosts only when nothing else
# does; either way the process keeps exactly one `Present` hook.
er-build-watermark-core = { path = "../er-build-watermark-core" }
hudhook = { version = "0.9.2", default-features = false, features = ["dx12"] }
# Keeps a click on a picker row from also reaching the game (a swing, or a pause-menu item).
er-dinput-suppress-core = { path = "../er-dinput-suppress-core" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
] }

[lints]
workspace = true
