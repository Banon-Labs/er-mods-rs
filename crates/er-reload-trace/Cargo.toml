[package]
name = "er-reload-trace"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_reload_trace"
crate-type = ["cdylib"]

# Shared MinHook FFI (compiles the vendored MinHook C once; this crate uses only the raw MH_* externs
# for its standalone-fallback instance and otherwise routes through the product's union export).
[dependencies]
er-hook = { path = "../er-hook" }
# Tier A only (default features = zero external deps): the shared singleton RVA table,
# so 0x3d709a8 / 0x3d64fb8 / 0x3d72840 are not hand-copied here. See er-game-base/src/rva.rs.
er-game-base = { path = "../er-game-base" }

[lints]
workspace = true
