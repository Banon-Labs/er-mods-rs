# Thin ME3-loadable shell for the reusable er-crash-logging-core crate.
# Ships as a standalone native DLL that can be listed beside ersc.dll to capture
# process crash breadcrumbs without loading the product er-quickload DLL.
[package]
name = "er-crash-logging"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_crash_logging"
crate-type = ["cdylib", "rlib"]

[dependencies]
er-crash-logging-core = { path = "../er-crash-logging-core" }
# For `panic_report::report_panics_to`. The hook is per-DLL -- every cdylib links its own copy of
# er-game-base -- so this shell has to install it itself even though its core already depends on it.
er-game-base = { path = "../er-game-base" }

# Assembles the patched window from NAMED instructions in `build.rs`, so a hand-typed byte can
# never disarm the patch. See `build-support/prologue_build.rs`.
[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }

# `write_code_byte` for the vanilla-crash patches in `src/patches/`, and MinHook for the one detour,
# `d3d12.dll!D3D12CreateDevice` in `src/dred.rs`, which captures the device for GPU crash reports.
[target.'cfg(windows)'.dependencies]
er-hook = { path = "../er-hook" }

[lints]
workspace = true
