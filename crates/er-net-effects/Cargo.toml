[package]
name = "er-net-effects"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_net_effects"
crate-type = ["cdylib"]

# Host-buildable and game-free, so the modules that carry the key-binding decisions
# (`bindings`, `selector_gate`) stay covered by `cargo test` on Linux -- which is where the
# gate in scripts/check.sh runs them.
[dependencies]
er-hotkey-config = { path = "../er-hotkey-config" }

[target.'cfg(windows)'.dependencies]
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }
er-quickload-data = { path = "../effects-data" }
er-hook = { path = "../er-hook" }
# Tier A only (zero external deps): the fresh-per-process log writer, so the run log and the
# crash-telemetry log each describe exactly one run.
er-game-base = { path = "../er-game-base" }
hudhook = { version = "0.9.2", default-features = false, features = ["dx12"] }
# The overlay host/guest registry, and the build watermark rows this module draws when it
# hosts the imgui context. Pinned to the SAME hudhook as above -- the `ui` pointer crosses a
# DLL boundary, and `OVERLAY_ABI_TAG` refuses the pair if they ever diverge.
er-build-watermark-core = { path = "../er-build-watermark-core" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
