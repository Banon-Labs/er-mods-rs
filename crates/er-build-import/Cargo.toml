[package]
name = "er-build-import"
version = "0.1.0"
edition = "2024"
publish = false

# Thin ME3-loadable shell around `er-build-import-runtime`, same split as er-loading-portrait-core /
# er-loading-portrait. Everything worth testing lives in the host crate `er-build-import-core` and is
# proven by `cargo test`; everything that touches the game lives in the runtime crate and is shared
# with the product DLL. This shell exists only to trigger a ONE-SHOT import of the configured build
# at character load, without the product's System>Quit menu.

[lib]
crate-type = ["cdylib"]

[dependencies]
er-build-import-core = { path = "../er-build-import-core" }
er-build-import-runtime = { path = "../er-build-import-runtime" }
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }

[target.'cfg(windows)'.dependencies]
# For the BOUNDED singleton wait -- an unbounded `loop { yield_now() }` of this exact shape
# saturated the wineserver and hung a boot on 2026-08-29. See er_game_base::wait.
er-game-base = { path = "../er-game-base" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
] }

[lints]
workspace = true
