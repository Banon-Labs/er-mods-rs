[package]
name = "er-death-persist"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "er_death_persist"
crate-type = ["cdylib"]

# Assembles each getter window from named instructions in `build.rs` and ground-truths it against
# `eldenring-deobf-1.17.2.bin`, so a hand-typed byte cannot silently disarm a hook.
[build-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
  "std",
  "code_asm",
] }

[target.'cfg(windows)'.dependencies]
er-game-base = { path = "../er-game-base" }
er-hook = { path = "../er-hook" }
eldenring = { path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../../fromsoftware-rs/crates/shared" }

[lints]
workspace = true
